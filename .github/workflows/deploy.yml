name: 테스트 + GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # 2026-10-17: Netlify 무료 사용량 초과(11/2 초기화)로 직원용 최신 버전을 GitHub Pages 에도 올림.
      # 학생 링크는 config.js 의 SITE_URL(Netlify) 그대로. 11/2 이후 다시 pages-redirect 로 되돌릴 수 있음
      - name: 앱 파일 준비 (캐시 번호 붙이기)
        run: |
          cp -r public _site
          grep -rl '__BUILD__' _site | xargs sed -i "s/__BUILD__/${GITHUB_SHA::8}/g"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
