<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f5c46">
  <title>나의 학습 캘린더</title>
  <link rel="icon" href="icon.svg?v=__BUILD__" type="image/svg+xml">
  <link rel="stylesheet" href="lib/app.css?v=__BUILD__">
  <style>
    .wrap { max-width: 1160px; margin: 0 auto; padding: 20px 16px 60px; }
    .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, #1f5c46, #2d7a5d); color: #fff; border-radius: 22px; padding: 24px 26px; display: flex; gap: 20px; justify-content: space-between; align-items: flex-start; }
    .hero::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, .07); }
    .hero .sub { color: rgba(255, 255, 255, .75); font-size: 13px; }
    .hero h1 { font-size: 26px; margin: 6px 0 4px; }
    .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
    .flow span { background: rgba(255, 255, 255, .14); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; }
    .flow span.done { background: rgba(255, 255, 255, .32); }
    .flow span.now { background: #fff; color: #1f5c46; }
    .flow i { color: rgba(255, 255, 255, .6); font-style: normal; font-size: 12px; }
    .todaybox { position: relative; z-index: 1; text-align: center; background: rgba(255, 255, 255, .14); border-radius: 14px; padding: 10px 14px; min-width: 76px; }
    .todaybox b { display: block; font-size: 22px; letter-spacing: -.02em; }
    .todaybox span { font-size: 12px; color: rgba(255, 255, 255, .8); }

    .keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .key { border-top: 4px solid var(--line); padding: 14px 16px; }
    .key .k { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
    .key .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0; }
    .key .t { font-weight: 700; font-size: 14px; }
    .key .s { font-size: 12.5px; color: var(--ink-2); }
    .key.class { border-top-color: var(--green); } .key.class .v { color: var(--green); }
    .key.open { border-top-color: var(--accent); } .key.open .v { color: var(--accent); }
    .key.exam { border-top-color: var(--blue); } .key.exam .v { color: var(--blue); }
    .key.meet { border-top-color: var(--violet); } .key.meet .v { color: var(--violet); }

    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 22px 0 12px; }
    .month { font-size: 22px; font-weight: 800; min-width: 104px; text-align: center; font-variant-numeric: tabular-nums; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }

    .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .cal .dow { text-align: center; font-size: 12.5px; font-weight: 700; color: var(--ink-2); padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cal .dow.sun, .day .n.sun { color: var(--red); } .cal .dow.sat, .day .n.sat { color: var(--blue); }
    .day { min-height: 104px; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); padding: 6px 6px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .day:nth-child(7n + 7) { border-right: none; }
    .day.out { background: var(--surface-2); }
    .day.out .n { color: var(--ink-3); }
    .day:hover { background: var(--surface-2); }
    .day.sel { box-shadow: inset 0 0 0 2px var(--brand); }
    .day .n { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .day.today .n b { background: var(--brand); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; padding: 0 6px; }
    .day .hol { font-size: 11px; color: var(--red); font-weight: 600; }
    .ev { display: flex; gap: 4px; font-size: 11.5px; line-height: 1.3; border-radius: 5px; padding: 2px 6px; background: var(--gray-soft); color: var(--ink); min-width: 0; }
    .ev span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev small { flex: none; color: var(--ink-2); font-weight: 700; font-variant-numeric: tabular-nums; }
    .ev.class { background: var(--green-soft); } .ev.plan { background: var(--amber-soft); } .ev.exam { background: var(--blue-soft); }
    .ev.meet { background: var(--violet-soft); } .ev.task { background: var(--gray-soft); } .ev.task.late { background: var(--red-soft); } .ev.done { text-decoration: line-through; opacity: .6; }
    .more { font-size: 11px; color: var(--ink-3); padding-left: 4px; }

    .side .card + .card { margin-top: 12px; }
    .agenda .li { align-items: flex-start; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; margin-right: 4px; }
    .tag.class { background: var(--green-soft); color: var(--green); } .tag.plan { background: var(--amber-soft); color: var(--amber); } .tag.exam { background: var(--blue-soft); color: var(--blue); }
    .tag.meet { background: var(--violet-soft); color: var(--violet); } .tag.task { background: var(--gray-soft); color: var(--gray); }
    .course { padding: 10px 0; border-top: 1px solid var(--line-2); }
    .course:first-child { border-top: none; }
    .course .meter { margin-top: 6px; }
    .listview .dayrow { display: grid; grid-template-columns: 86px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-2); }
    .listview .dayrow:first-child { border-top: none; }
    .listview .dayrow.today .d { color: var(--brand); }
    .listview .d { font-weight: 800; }

    /* 캘린더 아래 바로가기 (모바일 우선) */
    .extras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .extras > .x-files { grid-column: 1 / -1; }
    .x-ico { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255, 255, 255, .16); }
    .x-ico.soft { background: var(--green-soft); width: 38px; height: 38px; font-size: 19px; border-radius: 10px; }
    .x-career { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 18px; color: #fff; text-decoration: none; background: linear-gradient(135deg, #123e5c, #1d6a8a); min-height: 92px; }
    .x-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .x-txt b { font-size: 16px; } .x-txt span { font-size: 13px; opacity: .85; line-height: 1.4; }
    .x-go { flex: none; background: #fff; color: #123e5c; font-weight: 800; font-size: 13.5px; border-radius: 999px; padding: 8px 14px; }
    .x-sub { padding: 16px 18px; }
    .x-head { display: flex; gap: 12px; align-items: center; }
    .x-head b { display: block; font-size: 15.5px; } .x-head span { font-size: 13px; color: var(--ink-2); }
    .x-bul { margin: 12px 0 14px; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 13px; color: var(--ink-2); }
    .x-bul li::before { content: '✓'; color: var(--green); font-weight: 800; margin-right: 7px; }
    .x-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .x-btns .btn { height: 44px; justify-content: center; font-size: 14px; font-weight: 700; }
    .x-files { padding: 0; overflow: hidden; }
    .x-files summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; font-size: 15.5px; }
    .x-files summary::-webkit-details-marker { display: none; }
    .x-fold { margin-left: auto; width: 9px; height: 9px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); transition: transform .15s; }
    .x-files[open] .x-fold { transform: rotate(-135deg); }
    .x-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 14px 14px; }
    .x-file { display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 64px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: inherit; background: var(--surface); }
    .x-file:active { background: var(--surface-2); }
    .x-badge { flex: none; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
    .x-badge.doc { background: var(--red-soft); color: var(--red); }
    .x-badge.vid { background: var(--blue-soft); color: var(--blue); font-size: 16px; }
    .x-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .x-name b { font-size: 14px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
    .x-name span { font-size: 12px; color: var(--ink-3); }
    .x-act { flex: none; font-size: 13px; font-weight: 700; color: var(--brand); }
    .x-survey { padding: 16px 18px; border-color: var(--amber); grid-column: 1 / -1; }
    .x-stars { display: flex; gap: 6px; margin: 14px 0 10px; }
    .x-stars button { flex: 1; height: 48px; font-size: 26px; line-height: 1; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--line); cursor: pointer; }
    .x-stars button.on { color: #f5a524; border-color: #f5a524; background: #fff8e6; }
    .x-survey textarea, .x-form textarea { width: 100%; margin-bottom: 8px; font-size: 15px; }
    .x-form { margin-top: 12px; display: grid; gap: 8px; }
    .x-form .in { height: 44px; font-size: 15px; } .x-form textarea.in { height: auto; }
    .x-wide { width: 100%; height: 46px; justify-content: center; font-size: 15px; font-weight: 700; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .keys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .hero { flex-direction: column; }
      .hero h1 { font-size: 22px; }
      .day { min-height: 64px; padding: 4px 3px; }
      .ev { font-size: 0; padding: 0; height: 6px; border-radius: 3px; }
      .ev small { display: none; }
      .day .hol { font-size: 9.5px; }
      .key .v { font-size: 21px; }
      .extras, .x-grid { grid-template-columns: 1fr; }
      .x-career { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=__BUILD__"></script>
  <script src="lib/util.js?v=__BUILD__"></script>
  <script src="lib/seed.js?v=__BUILD__"></script>
  <script src="lib/store.js?v=__BUILD__"></script>
  <script>
  (function () {
    const { esc, fmt, today, addDays, diffDays, dday, DAYS, HOLIDAYS, sessions, iso, parse } = U;
    const app = document.getElementById('app');
    const token = new URLSearchParams(location.search).get('t');
    const C = Store.config;
    const t = today();
    const ui = { month: t.slice(0, 7), sel: t, view: 'cal', filter: 'all' };
    try { const v = localStorage.getItem('haksa-stu-view'); if (v === 'list' || v === 'cal') ui.view = v; } catch (e) {}
    let data, byDate, items;

    function notFound(msg) {
      app.innerHTML = `<div class="card card-pad" style="margin:40px auto;max-width:420px;text-align:center"><div class="brand-mark" style="margin:0 auto 12px">대</div><h2 style="font-size:18px">${esc(msg)}</h2><p class="faint">담당 멘토에게 새 링크를 요청하세요.</p></div>`;
    }

    // 날짜별 일정 만들기: 수업 회차, 집에서 학습, 시험(접수·시험·발표), 면담, 할 일 마감
    function build() {
      byDate = {};
      const add = (d, e) => { (byDate[d] = byDate[d] || []).push(e); };
      items = [];
      data.classes.forEach(c => {
        const ss = sessions(c);
        items.push({ kind: 'class', c, ss });
        ss.forEach((d, i) => add(d, { kind: 'class', title: c.name, n: i + 1, N: ss.length, time: `${c.start || ''}~${c.end || ''}`, place: c.room, rec: (c.recordings || {})[d], zoom: d >= t ? c.zoom : null }));
      });
      (data.student.plans || []).forEach(p => {
        const ss = sessions(p);
        items.push({ kind: 'plan', c: p, ss });
        ss.forEach((d, i) => add(d, { kind: 'plan', title: p.name, n: i + 1, N: ss.length, place: '집에서', time: p.note || '' }));
      });
      data.exams.forEach(e => {
        if (e.regStart) add(e.regStart, { kind: 'exam', title: `${e.name} 접수 시작`, time: e.regEnd ? `~${fmt(e.regEnd)} 마감` : '' });
        if (e.regEnd && e.regEnd !== e.regStart) add(e.regEnd, { kind: 'exam', title: `${e.name} 접수 마감`, time: '' });
        const last = e.examEnd || e.examDate;
        for (let d = e.examDate; d && d <= last; d = addDays(d, 1)) add(d, { kind: 'exam', title: `${e.name} 시험`, time: e.examEnd && e.examEnd !== e.examDate ? `${fmt(e.examDate)}~${fmt(e.examEnd)} 중 응시` : '' });
        if (e.resultDate) add(e.resultDate, { kind: 'exam', title: `${e.name} 발표`, time: '' });
      });
      data.meetings.forEach(m => add(m.date, { kind: 'meet', title: `면담${m.topic ? ' · ' + m.topic : ''}`, time: m.time || '' }));
      data.tasks.forEach(k => { if (k.due) add(k.due, { kind: 'task', title: k.title, time: '마감', done: k.done, late: !k.done && k.due < t, id: k.id }); });
      Object.values(byDate).forEach(list => list.sort((a, b) => ['exam', 'meet', 'class', 'plan', 'task'].indexOf(a.kind) - ['exam', 'meet', 'class', 'plan', 'task'].indexOf(b.kind)));
    }
    const pass = e => ui.filter === 'all' || (ui.filter === 'class' && (e.kind === 'class' || e.kind === 'plan')) || (ui.filter === 'event' && (e.kind === 'exam' || e.kind === 'meet')) || (ui.filter === 'task' && e.kind === 'task');

    function keyCards() {
      // 다음 수업, 다음 개강, 다음 시험(접수 포함), 다음 면담
      let next = null;
      Object.keys(byDate).sort().forEach(d => { if (!next && d >= t) { const e = byDate[d].find(x => x.kind === 'class'); if (e) next = { d, e }; } });
      const opening = data.classes.filter(c => c.startDate > t).sort((a, b) => a.startDate.localeCompare(b.startDate))[0];
      const ex = data.exams.map(e => ({ e, d: e.regEnd >= t && e.regStart <= t ? e.regEnd : e.examDate, reg: e.regEnd >= t && e.regStart <= t }))
        .filter(x => (x.e.examEnd || x.e.examDate) >= t).sort((a, b) => a.d.localeCompare(b.d))[0];
      const mt = data.meetings.filter(m => m.date >= t).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')))[0];
      const card = (cls, k, v, ti, s) => `<div class="card key ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="t">${ti}</div><div class="s">${s}</div></div>`;
      return `<div class="keys">
        ${next ? card('class', '다음 수업', dday(next.d), `${esc(next.e.title)} · ${next.e.n}/${next.e.N}회`, `${fmt(next.d)} ${esc(next.e.time)}${next.e.place ? ' · ' + esc(next.e.place) : ''}${zoomLink(next.e)}`) : card('class', '다음 수업', '-', '예정된 수업이 없어요', '')}
        ${opening ? card('open', '다음 개강', dday(opening.startDate), esc(opening.name), `${fmt(opening.startDate)} · ${(opening.days || []).map(d => DAYS[d]).join('·')}`) : card('open', '다음 개강', '-', '예정된 개강이 없어요', '')}
        ${ex ? card('exam', ex.reg ? '시험 접수 마감' : '다음 시험', dday(ex.d), esc(ex.e.name), ex.reg ? `${fmt(ex.e.regEnd)}까지 접수 · 시험 ${fmt(ex.e.examDate)}` : `시험 ${fmt(ex.e.examDate)}${ex.e.examEnd && ex.e.examEnd !== ex.e.examDate ? '~' + fmt(ex.e.examEnd) : ''}`) : card('exam', '다음 시험', '-', '연결된 시험이 없어요', '멘토에게 응시 시험을 알려주세요')}
        ${mt ? card('meet', '다음 면담', dday(mt.date), esc(mt.topic || '멘토 면담'), `${fmt(mt.date)} ${esc(mt.time || '')}`) : card('meet', '다음 면담', '-', '예정된 면담이 없어요', '')}
      </div>`;
    }

    function calendar() {
      const [y, m] = ui.month.split('-').map(Number);
      const first = new Date(y, m - 1, 1);
      const start = iso(new Date(y, m - 1, 1 - first.getDay()));
      const cells = [];
      for (let i = 0; i < 42; i++) {
        const d = addDays(start, i);
        if (i >= 35 && d.slice(0, 7) !== ui.month) break;
        const list = (byDate[d] || []).filter(pass);
        const dw = U.dow(d), hol = HOLIDAYS[d];
        const shown = list.slice(0, 3);
        cells.push(`<div class="day ${d.slice(0, 7) !== ui.month ? 'out' : ''} ${d === t ? 'today' : ''} ${d === ui.sel ? 'sel' : ''}" data-d="${d}">
          <div class="n ${dw === 0 || hol ? 'sun' : dw === 6 ? 'sat' : ''}"><b>${Number(d.slice(8))}</b>${hol ? `<span class="hol">${esc(hol)}</span>` : ''}</div>
          ${shown.map(e => `<div class="ev ${e.kind} ${e.done ? 'done' : ''} ${e.late ? 'late' : ''}" title="${esc(e.title)}${e.N ? ` (${e.n}/${e.N}회)` : ''}${e.rec && e.rec.url ? ' · 녹화본 있음' : ''}"><span>${e.rec && e.rec.url ? '▶ ' : ''}${esc(short(e.title))}</span>${e.N ? `<small>${e.n}/${e.N}</small>` : ''}</div>`).join('')}
          ${list.length > 3 ? `<div class="more">+${list.length - 3}</div>` : ''}
        </div>`);
      }
      return `<div class="card" style="overflow:hidden"><div class="cal">${DAYS.map((x, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${x}</div>`).join('')}${cells.join('')}</div></div>`;
    }
    const short = s => String(s).replace(/^\[[^\]]+\]\s*/, '').replace(/\s·\s.*$/, '');

    function listView() {
      const days = Object.keys(byDate).filter(d => d.slice(0, 7) === ui.month).sort();
      const rows = days.map(d => { const list = byDate[d].filter(pass); return list.length ? `<div class="dayrow ${d === t ? 'today' : ''}"><div class="d">${fmt(d)}${d === t ? '<div class="faint">오늘</div>' : ''}${HOLIDAYS[d] ? `<div class="faint" style="color:var(--red)">${esc(HOLIDAYS[d])}</div>` : ''}</div><div>${list.map(ev).join('')}</div></div>` : ''; }).join('');
      return `<div class="card card-pad listview">${rows || '<div class="empty">이 달에는 일정이 없어요</div>'}</div>`;
    }
    const KIND = { class: '학원 수업', plan: '집에서 학습', exam: '시험', meet: '면담', task: '할 일' };
    const ev = e => `<div style="padding:4px 0;${e.done ? 'text-decoration:line-through;opacity:.6' : ''}"><span class="tag ${e.kind}">${KIND[e.kind]}</span><b style="font-size:14px">${esc(e.title)}</b>${e.N ? ` <span class="faint">${e.n}/${e.N}회</span>` : ''}${e.time || e.place ? `<div class="faint" style="margin-left:2px">${esc([e.time, e.place].filter(Boolean).join(' · '))}</div>` : ''}${zoomLink(e)}${recLink(e)}</div>`;
    // 실시간 수업 줌: 오늘·앞으로의 수업 날짜에만, https 링크만
    const zoomLink = e => e.zoom && /^https?:\/\//i.test(e.zoom.url || '') ? `<div style="margin:6px 0 2px"><a class="btn sm" style="background:#2D8CFF;color:#fff;border-color:#2D8CFF" href="${esc(e.zoom.url)}" target="_blank" rel="noopener noreferrer">● 실시간 수업 참여</a>${e.zoom.meetingId || e.zoom.pw ? ` <span class="faint">${[e.zoom.meetingId && 'ID ' + esc(e.zoom.meetingId), e.zoom.pw && '암호 ' + esc(e.zoom.pw)].filter(Boolean).join(' · ')}</span>` : ''}</div>` : '';
    // 녹화본: https 링크만, 새 창으로
    const recNote = n => /^\s*(암호|비밀번호|passcode|password)/i.test(n) ? n : '암호: ' + n;
    const recLink = e => e.rec && /^https?:\/\//i.test(e.rec.url || '') ? `<div style="margin:6px 0 2px"><a class="btn sm primary" href="${esc(e.rec.url)}" target="_blank" rel="noopener noreferrer">▶ 녹화본 보기</a>${e.rec.note ? ` <b style="font-size:13px">${esc(recNote(e.rec.note))}</b>` : ''}<div class="faint" style="font-size:12px;margin-top:4px">녹화본 유지기간은 일주일이며, 일주일 이후 링크는 삭제됩니다.</div></div>` : '';

    // 실시간 수업 줌: 날짜와 상관없이 항상 보이게 (종강 전 수업만, 같은 링크는 한 줄로)
    function zoomBox() {
      const by = {};
      data.classes.filter(c => c.zoom && /^https?:\/\//i.test(c.zoom.url || '') && !c.archived && (c.endDate || '9999') >= t)
        .sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''))
        .forEach(c => { const k = c.zoom.url; (by[k] = by[k] || { z: c.zoom, names: [] }).names.push(c.name); });
      const rows = Object.values(by);
      if (!rows.length) return '';
      return `<section class="card"><div class="card-head"><h3>실시간 수업 줌</h3><span class="faint">수업 시간에 눌러서 들어가요</span></div><div class="card-body"><div class="list">
        ${rows.map(r => `<div class="li" style="display:block"><b style="font-size:14px">${r.names.map(esc).join(' · ')}</b>${zoomLink({ zoom: r.z })}</div>`).join('')}
      </div></div></section>`;
    }

    // 수업 공지: 게시 끝나는 날(없으면 종강일)까지 맨 위에
    function noticeBox() {
      const list = data.classes.filter(c => c.notice && c.notice.text && !c.archived && (c.notice.until || c.endDate || '9999') >= t);
      if (!list.length) return '';
      return `<section class="card" style="border-color:#f59e0b"><div class="card-head"><h3>📢 수업 공지</h3></div><div class="card-body"><div class="list">
        ${list.map(c => `<div class="li" style="display:block"><b style="font-size:14px">${esc(c.name)}</b><div style="white-space:pre-wrap;margin-top:6px;font-size:14px">${esc(c.notice.text)}</div></div>`).join('')}
      </div></div></section>`;
    }

    // 캘린더 아래 바로가기: 진로 검사 · 휴대폰 캘린더 구독 · 자료 (모바일 기준 큰 터치 영역)
    function extras() {
      const feed = C.SUPABASE_URL && !Store.forceDemo ? `${C.SUPABASE_URL.replace(/^https?:/, 'webcal:')}/functions/v1/calendar-feed?t=${encodeURIComponent(token)}` : '';
      return `<div class="extras">
        ${surveyBox()}
        <a class="x-career" href="https://url.kr/mreprs" target="_blank" rel="noopener">
          <span class="x-ico">🧭</span><span class="x-txt"><b>IT 진로 · 적성 검사</b><span>5분이면 나와 잘 맞는 IT 분야 TOP 3가 보여요</span></span><span class="x-go">시작 ›</span></a>
        ${feed ? `<section class="card x-sub"><div class="x-head"><span class="x-ico soft">📲</span><div><b>내 휴대폰 캘린더에 추가</b><span>한 번만 누르면 수업 일정이 휴대폰에 들어가요</span></div></div>
          <ul class="x-bul"><li>수업 2시간 전 · 개강 3일 전 알림</li><li>자격증 접수 10일 · 5일 전 · 당일 알림</li><li>일정이 바뀌면 자동으로 따라 바뀌어요</li></ul>
          <div class="x-btns"><a class="btn primary" href="${esc(feed)}">아이폰 · 맥</a><a class="btn" href="https://calendar.google.com/calendar/render?cid=${encodeURIComponent(feed)}" target="_blank" rel="noopener">구글 · 안드로이드</a></div></section>` : ''}
        ${requestBox()}
        ${filesBox()}
      </div>`;
    }
    // 자격증 접수 · 시험 · 발표가 7일 안이거나 진행 중인 것 (학원이 등록한 전체 시험 일정)
    function examSoonBox() {
      const until = addDays(t, 7), rows = [];
      (data.allExams || []).forEach(e => [['접수', e.regStart, e.regEnd], ['시험', e.examDate, e.examEnd], ['발표', e.resultDate]].forEach(([k, a, b]) => {
        b = b || a;
        if (!a || a > until || b < t) return;
        const gcal = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`🎓 ${e.name} ${k}`)}&dates=${a.replace(/-/g, '')}/${addDays(b, 1).replace(/-/g, '')}&details=${encodeURIComponent(e.memo || '')}`;
        rows.push({ a, html: `<div class="li" style="display:block"><span class="tag exam">${k}</span><b style="font-size:14px">${esc(e.name)}</b>
          <div class="faint">${fmt(a)}${b !== a ? ' ~ ' + fmt(b) : ''} · ${a <= t ? (b !== a ? `진행 중 · ${dday(b)} 마감` : '오늘') : dday(a)}</div>
          <a class="btn sm" style="margin-top:6px" href="${esc(gcal)}" target="_blank" rel="noopener">구글 캘린더에 추가</a></div>` });
      }));
      if (!rows.length) return '';
      return `<section class="card"><div class="card-head"><h3>🎓 자격증 접수 · 시험 7일 이내</h3><span class="faint">${rows.length}건</span></div><div class="card-body"><div class="list">${rows.sort((x, y) => x.a.localeCompare(y.a)).map(r => r.html).join('')}</div></div></section>`;
    }
    // 수업 만족도: 회차 절반이 지나면 '중간', 마지막 회차 무렵엔 '종강' 설문 (종강 2주 뒤까지)
    function surveysDue() {
      const done = new Set((data.surveys || []).map(v => v.classId + ':' + v.kind));
      return items.filter(x => x.kind === 'class' && x.ss.length >= 2 && !(x.c.endDate && addDays(x.c.endDate, 14) < t)).map(x => {
        const N = x.ss.length, passed = x.ss.filter(d => d <= t).length;
        const kind = passed >= N - 1 ? 'final' : passed >= Math.ceil(N / 2) ? 'mid' : null;
        return kind && !done.has(x.c.id + ':' + kind) ? { c: x.c, kind } : null;
      }).filter(Boolean);
    }
    function surveyBox() {
      return surveysDue().map(({ c, kind }) => `<section class="card x-survey" data-survey="${esc(c.id)}">
        <div class="x-head"><span class="x-ico soft">⭐</span><div><b>${kind === 'final' ? '종강 설문' : '중간 점검'} · ${esc(c.name)}</b><span>${kind === 'final' ? '수업은 어떠셨어요? 다음 수업을 더 좋게 만드는 데 써요' : '지금까지 수업 어떠세요? 30초면 끝나요'}</span></div></div>
        <div class="x-stars" role="radiogroup" aria-label="별점">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-act="star" data-n="${n}" aria-label="${n}점">★</button>`).join('')}</div>
        <textarea class="in" rows="2" maxlength="500" placeholder="좋았던 점이나 바라는 점을 한 줄 남겨 주세요 (선택)"></textarea>
        <button class="btn primary x-wide" data-act="survey-send" data-cid="${esc(c.id)}" data-kind="${kind}">보내기</button>
        <div class="faint" style="font-size:12px;margin-top:6px">담당 선생님과 학원만 봐요.</div></section>`).join('');
    }
    // 면담 · 질문 신청 → 담당 멘토가 확인 후 연락
    function requestBox() {
      const reqs = (data.meetings || []).filter(m => m.request).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      return `<section class="card x-sub"><div class="x-head"><span class="x-ico soft">💬</span><div><b>멘토에게 면담 · 질문 신청</b><span>원하는 날짜와 궁금한 점을 남기면 멘토가 확인하고 연락드려요</span></div></div>
        <div class="x-form" id="req-form">
          <div class="x-btns"><input class="in" type="date" name="date" value="${addDays(t, 1)}" min="${t}" max="${addDays(t, 60)}" aria-label="희망 날짜"><input class="in" type="time" name="time" aria-label="희망 시간 (선택)"></div>
          <textarea class="in" name="text" rows="2" maxlength="300" placeholder="예: 포트폴리오 방향이 궁금해요 / 자격증 일정 상담"></textarea>
          <button class="btn primary x-wide" data-act="meet-req">신청하기</button>
        </div>
        ${reqs.length ? `<div class="list" style="margin-top:12px">${reqs.map(m => `<div class="li"><div class="main"><div class="t">${fmt(m.date)} ${esc(m.time || '')}</div><div class="s">${esc(m.request.text || '')}</div></div><span class="pill ${m.request.seen ? 'green' : 'amber'}">${m.request.seen ? '멘토 확인' : '확인 대기'}</span></div>`).join('')}</div>` : ''}
      </section>`;
    }
    // 학생 자료실 (직원이 관리자 화면 설정에서 올림)
    const fsize = n => !n ? '' : n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
    function filesBox() {
      const list = (data.files || []).filter(f => /^https:\/\//i.test(f.url || ''));
      if (!list.length) return '';
      // 동영상은 내려받지 않고 새 창에서 바로 재생
      const video = f => /\.(mp4|webm|mov|m4v)$/i.test(f.name || '');
      const ext = f => ((f.name || '').match(/\.([a-z0-9]+)$/i) || [, '파일'])[1].toUpperCase();
      return `<details class="card x-files" open><summary><span class="x-ico soft">📎</span><b>학습 자료</b><span class="faint">${list.length}개</span><span class="x-fold"></span></summary>
        <div class="x-grid">${list.map(f => `<a class="x-file" href="${esc(f.url)}${video(f) ? '' : '?download=' + encodeURIComponent(f.name)}"${video(f) ? ' target="_blank" rel="noopener"' : ''}>
          <span class="x-badge ${video(f) ? 'vid' : 'doc'}">${video(f) ? '▶' : esc(ext(f))}</span>
          <span class="x-name"><b>${esc(f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' '))}</b><span>${video(f) ? '동영상 · ' : ''}${fsize(f.size)}</span></span>
          <span class="x-act">${video(f) ? '보기' : '받기 ↓'}</span></a>`).join('')}</div></details>`;
    }

    // 출석 기록이 있으면 '출석 n · 지각 n · 결석 n'
    const attText = cid => { const a = (data.attendance || []).filter(r => r.classId === cid); if (!a.length) return ''; const n = k => a.filter(r => r.state === k).length; return ` · 출석 ${n('present')}${n('late') ? ` · 지각 ${n('late')}` : ''}${n('absent') ? ` · <b style="color:var(--red)">결석 ${n('absent')}</b>` : ''}`; };

    function side() {
      const list = (byDate[ui.sel] || []);
      const tasks = data.tasks.slice().sort((a, b) => (a.done - b.done) || ((a.due || '9') < (b.due || '9') ? -1 : 1));
      const courses = items.filter(x => x.ss.length || x.c.startDate).sort((a, b) => (a.c.startDate || '').localeCompare(b.c.startDate || ''));
      const course = x => {
        const done = x.ss.filter(d => d < t).length, N = x.ss.length;
        const st = (x.c.endDate || '') < t ? '종료' : (x.c.startDate || '') > t ? `개강 ${dday(x.c.startDate)}` : '진행 중';
        return `<div class="course"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="font-size:14px">${esc(x.c.name)}</b><span class="tag ${x.kind}">${x.kind === 'plan' ? '집에서' : st}</span></div>
          <div class="faint">${fmt(x.c.startDate)}~${fmt(x.c.endDate)} · ${(x.c.days || []).map(d => DAYS[d]).join('·')}${x.kind === 'class' && x.c.start ? ' ' + esc(x.c.start) : ''}${x.c.room ? ' · ' + esc(x.c.room) : ''}</div>
          ${N ? `<div class="meter"><i style="width:${Math.round(done / N * 100)}%"></i></div><div class="faint">${done}/${N}회 진행${attText(x.c.id)}</div>` : ''}</div>`;
      };
      return `<div class="side">
        ${noticeBox()}
        ${zoomBox()}
        ${examSoonBox()}
        <section class="card"><div class="card-head"><h3>${fmt(ui.sel)}${ui.sel === t ? ' · 오늘' : ''}</h3>${HOLIDAYS[ui.sel] ? `<span class="pill red">${esc(HOLIDAYS[ui.sel])}</span>` : ''}</div>
          <div class="card-body agenda">${list.length ? list.map(ev).join('') : '<div class="faint">이 날은 일정이 없어요</div>'}</div></section>
        <section class="card"><div class="card-head"><h3>할 일</h3><span class="faint">${tasks.filter(k => !k.done).length}개 남음</span></div><div class="card-body">
          ${tasks.length ? `<div class="list">${tasks.map(k => `<label class="li check"><input type="checkbox" data-task="${esc(k.id)}" ${k.done ? 'checked' : ''}><span class="grow" style="${k.done ? 'text-decoration:line-through;color:var(--ink-3)' : ''}">${esc(k.title)}</span>${k.due ? `<span class="pill ${!k.done && k.due < t ? 'red' : 'outline'}">${fmt(k.due)}</span>` : ''}</label>`).join('')}</div>` : '<div class="faint">지금은 할 일이 없어요</div>'}
        </div></section>
        <section class="card"><div class="card-head"><h3>수강 과정</h3><span class="faint">${courses.length}개</span></div><div class="card-body">${courses.map(course).join('') || '<div class="faint">연결된 과정이 없어요</div>'}</div></section>
        ${(data.student.certs || []).length ? `<section class="card"><div class="card-head"><h3>자격증</h3></div><div class="card-body"><div class="list">${data.student.certs.map(c => `<div class="li"><div class="main"><div class="t">${esc(c.name)}</div></div><span class="pill ${c.status === '합격' ? 'green' : c.status === '불합격' ? 'red' : 'amber'}">${esc(c.status)}</span></div>`).join('')}</div></div></section>` : ''}
      </div>`;
    }

    function render() {
      const s = data.student;
      const road = s.roadmap || [];
      const nowIdx = road.findIndex(r => !r.done);
      const [y, m] = ui.month.split('-').map(Number);
      const monthItems = items.filter(x => x.ss.some(d => d.slice(0, 7) === ui.month));
      app.innerHTML = `
      <section class="hero">
        <div style="position:relative;z-index:1">
          <div class="sub">${esc(C.ACADEMY_NAME || '')} · 학습 캘린더</div>
          <h1>${esc(s.name)} 님 학습 캘린더</h1>
          <div class="sub" style="font-size:14px">${esc(s.intro || s.goal || '학원 수업, 집에서 학습, 시험과 면담을 한 화면에서 확인해요.')}</div>
          ${road.length ? `<div class="flow">${road.map((r, i) => `<span class="${r.done ? 'done' : i === nowIdx ? 'now' : ''}">${r.done ? '✓ ' : ''}${esc(r.title)}</span>`).join('<i>→</i>')}</div>` : ''}
        </div>
        <div class="todaybox"><span>오늘</span><b>${Number(t.slice(5, 7))}.${Number(t.slice(8))}</b><span>${DAYS[U.dow(t)]}요일</span></div>
      </section>
      ${keyCards()}
      <div class="bar">
        <div class="row"><button class="btn sm" data-act="prev" aria-label="이전 달">◀</button><span class="month">${y}. ${String(m).padStart(2, '0')}</span><button class="btn sm" data-act="next" aria-label="다음 달">▶</button><button class="btn sm" data-act="today">오늘</button></div>
        <div class="row">
          <div class="seg"><button class="${ui.view === 'cal' ? 'on present' : ''}" data-act="view" data-v="cal">달력</button><button class="${ui.view === 'list' ? 'on present' : ''}" data-act="view" data-v="list">목록</button></div>
          <div class="chips">${[['all', '전체'], ['class', '수업·학습'], ['event', '시험·면담'], ['task', '할 일']].map(([k, l]) => `<button class="chip ${ui.filter === k ? 'on' : ''}" data-act="filter" data-v="${k}">${l}</button>`).join('')}</div>
        </div>
      </div>
      ${monthItems.length ? `<details class="card card-pad" style="margin-bottom:12px" ${window.innerWidth > 900 ? '' : ''}><summary style="cursor:pointer;font-weight:700">이달의 과정 · 학습 ${monthItems.length}개</summary>
        <div class="list" style="margin-top:8px">${monthItems.map(x => `<div class="li"><span class="tag ${x.kind}">${x.kind === 'plan' ? '집에서' : '학원'}</span><div class="main"><div class="t">${esc(x.c.name)}</div><div class="s">${fmt(x.c.startDate)} → ${fmt(x.c.endDate)} · ${(x.c.days || []).map(d => DAYS[d]).join('·')} · ${x.ss.length}회</div></div></div>`).join('')}</div></details>` : ''}
      <div class="layout">
        <div>${ui.view === 'cal' ? calendar() : listView()}
          <p class="faint" style="margin:8px 2px 0">수업 날짜는 공휴일과 휴강을 빼고 계산했어요. 휴강·보강은 바뀔 수 있으니 멘토 안내를 우선으로 확인하세요.</p>
          ${extras()}</div>
        ${side()}
      </div>
      <p class="faint" style="text-align:center;margin-top:24px">이 링크는 ${esc(s.name)}님 전용이에요. 다른 사람과 공유하지 마세요.</p>`;
    }

    app.addEventListener('click', e => {
      const day = e.target.closest('[data-d]');
      if (day) { ui.sel = day.dataset.d; render(); if (window.innerWidth <= 900) document.querySelector('.side').scrollIntoView({ behavior: 'smooth' }); return; }
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'star') { const box = b.closest('[data-survey]'); box.dataset.score = b.dataset.n; box.querySelectorAll('[data-act=star]').forEach(x => x.classList.toggle('on', Number(x.dataset.n) <= Number(b.dataset.n))); return; }
      if (b.dataset.act === 'survey-send') {
        const box = b.closest('[data-survey]'), score = Number(box.dataset.score || 0);
        if (!score) { alert('별점을 골라 주세요'); return; }
        b.disabled = true;
        Store.studentSurvey(token, b.dataset.cid, b.dataset.kind, score, box.querySelector('textarea').value.trim())
          .then(() => { data.surveys = (data.surveys || []).concat({ classId: b.dataset.cid, kind: b.dataset.kind }); render(); alert('보내 주셔서 고마워요!'); })
          .catch(() => { b.disabled = false; alert('보내지 못했어요. 잠시 후 다시 시도해 주세요.'); });
        return;
      }
      if (b.dataset.act === 'meet-req') {
        const f = document.getElementById('req-form'), v = k => f.querySelector(`[name=${k}]`).value.trim();
        if (!v('date') || !v('text')) { alert('날짜와 내용을 넣어 주세요'); return; }
        b.disabled = true;
        Store.studentRequestMeeting(token, v('date'), v('time'), v('text'))
          .then(() => Store.studentView(token)).then(d => { data.meetings = d.meetings; render(); alert('신청했어요. 멘토가 확인하고 연락드릴게요.'); })
          .catch(err => { b.disabled = false; alert(/too many/.test(err && err.message) ? '확인을 기다리는 신청이 3개 있어요. 멘토 확인 후 다시 신청해 주세요.' : '신청하지 못했어요. 날짜(오늘~60일 안)와 내용을 확인해 주세요.'); });
        return;
      }
      const [y, m] = ui.month.split('-').map(Number);
      const go = k => { const d = new Date(y, m - 1 + k, 1); ui.month = iso(d).slice(0, 7); };
      if (b.dataset.act === 'prev') go(-1);
      if (b.dataset.act === 'next') go(1);
      if (b.dataset.act === 'today') { ui.month = t.slice(0, 7); ui.sel = t; }
      if (b.dataset.act === 'view') { ui.view = b.dataset.v; try { localStorage.setItem('haksa-stu-view', ui.view); } catch (err) {} }
      if (b.dataset.act === 'filter') ui.filter = b.dataset.v;
      render();
    });
    app.addEventListener('change', async e => {
      const id = e.target.dataset.task;
      if (!id) return;
      try {
        await Store.studentSetTask(token, id, e.target.checked);
        const k = data.tasks.find(x => x.id === id);
        if (k) k.done = e.target.checked;
        build(); render();
      } catch (err) { e.target.checked = !e.target.checked; alert('저장하지 못했어요. 잠시 후 다시 시도해주세요.'); }
    });

    if (!token) return notFound('학생 전용 링크로 들어와 주세요');
    Store.studentView(token).then(d => {
      if (!d || !d.student) return notFound('열 수 없는 링크예요');
      data = d;
      data.classes = (data.classes || []).filter(c => !c.archived);
      document.title = `${d.student.name} · 학습 캘린더`;
      build(); render();
    }).catch(() => notFound('잠시 연결이 원활하지 않아요'));
  })();
  </script>
</body>
</html>
